  const wrows=['tr','rv','co'].filter(id=>!wById(id).hide).map(id=>{const w=wById(id);return `<div class="card" style="padding:12px 14px"><div class="row"><b>${esc(w.name)}</b><span class="small mute">En la app: ${fmt(wCash(id))}</span></div><label>Saldo real en el banco (€)</label><input data-rv="w:${id}" type="number" inputmode="decimal" step="0.01" value="${wCash(id).toFixed(2)}"><div class="small" id="rvo_w:${id}" style="margin-top:6px"></div></div>`}).join('');

function rvPaint(){const prev=rvPrev();document.querySelectorAll('[data-rv]').forEach(i=>{const[t,id]=i.dataset.rv.split(':'),v=parseFloat(i.value),o=document.getElementById('rvo_'+i.dataset.rv);if(!o)return;if(!isFinite(v)){o.innerHTML='';return}
  if(t==='h'){const c=holdCost(id),g=r2(v-c),pc=c>0?g/c*100:0;let m='';const ph=prev&&prev.h&&prev.h[id];if(ph&&ph.v>0){const mg=r2((v-ph.v)-(c-ph.c));m=` · Este mes <b class="${mg>=0?'okc':'badc'}">${sgn(mg)} (${(mg/ph.v*100).toFixed(2).replace('.',',')} %)</b>`}
    o.innerHTML=`Total <b class="${g>=0?'okc':'badc'}">${sgn(g)} (${pc>=0?'+':''}${pc.toFixed(2).replace('.',',')} %)</b>${m}`}
  else{const d=r2(v-wCash(id));o.innerHTML=d>0?`Intereses: <b class="okc">+${fmt(d)}</b>`:d<0?`Ajuste: <b class="badc">${sgn(d)}</b>`:'<span class="mute">Sin cambios</span>'}})}
