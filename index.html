function wCash(id){if(id==='uni')return balance();const w=wById(id);let b=w.open;

let TI=0,TRET=0;

function tBackShow(){tBackHide();const b=document.createElement('div');b.id='tback';b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;gap:6px;align-items:center;background:var(--ink);color:var(--bg);border-radius:999px;padding:4px 4px 4px 4px;box-shadow:0 4px 16px rgba(0,0,0,.35)';
b.innerHTML='<button data-tut="back" style="background:none;border:0;color:inherit;font-weight:700;padding:10px 14px">↩ Volver al tutorial</button><button data-tut="hideback" aria-label="Cerrar" style="background:none;border:0;color:inherit;opacity:.7;padding:10px 12px">✕</button>';document.body.appendChild(b)}
function tutSetup(){const b=parseFloat(document.getElementById('tb0').value),l=parseFloat(document.getElementById('tl0').value);
if(isNaN(b)){document.getElementById('tb0').focus();toast('Escribe el dinero que tienes en el banco');return false}if(isNaN(l)||l<0){document.getElementById('tl0').focus();return false}
newState(b,l,document.getElementById('ttrk').value.trim(),{fx:document.getElementById('tft-fx').checked,goals:document.getElementById('tft-goals').checked,inv:document.getElementById('tft-inv').checked},false);S.tut=1;save();render();return true}
function tutOpen(i){tBackHide();const L=TS();TI=Math.max(0,Math.min(L.length-1,i));const s=L[TI],last=TI===L.length-1;
close();open(`<div data-tourbox style="display:flex;flex-direction:column;min-height:100%"><div class="row"><span class="small mute">Paso ${TI+1} de ${L.length}</span><button data-tut="end" aria-label="Cerrar tutorial" style="font-size:18px;line-height:1;padding:8px 12px">✕</button></div>
<div class="bar" style="height:6px;margin:10px 0 18px"><i style="width:${(TI+1)/L.length*100}%;background:var(--ok)"></i></div>
<div style="flex:1"><h2 style="font-size:26px;margin-top:8px">${s.t}</h2><div style="margin-top:14px;line-height:1.65;font-size:16px">${s.h}</div>
${s.go?`<button class="wb" data-gg="${s.go}" style="width:100%;margin-top:6px">${s.gl} →</button>`:''}</div>
<div class="row" style="margin-top:20px;gap:10px;padding-top:12px"><button data-tut="prev" style="flex:1;padding:12px"${TI===0?' disabled':''}>Anterior</button><button class="pri" data-tut="next" style="flex:1;padding:12px">${last?'Terminar':'Siguiente'}</button></div></div>`);$('#sh').classList.add('full')}
function tutAsk(){close();open(`<div style="display:flex;flex-direction:column;justify-content:center;min-height:100%"><h2 style="font-size:26px">¿Quieres un tutorial rápido?</h2><p class="mute" style="line-height:1.5">Te enseñamos lo básico en 2 minutos: añadir movimientos, el límite mensual, objetivos y copias de seguridad.</p><button class="pri" data-tut="start" style="width:100%;margin-top:10px;padding:13px">▶ Ver tutorial</button><button data-tut="end" style="width:100%;margin-top:10px;padding:13px">Omitir por ahora</button><p class="mute small" style="text-align:center;margin-top:12px">Lo tendrás siempre en Ajustes → Tutorial y ayuda.</p></div>`);$('#sh').classList.add('full')}
document.addEventListener('click',e=>{const t=e.target.closest('[data-tut]');if(t){const a=t.dataset.tut;if(a==='start')tutOpen(0);else if(a==='next'){if(TS()[TI].form&&!S&&!tutSetup())return;if(TI>=TS().length-1){S.tutDone=1;save();close()}else tutOpen(TI+1)}else if(a==='prev')tutOpen(TI-1);else if(a==='back'){close();tutOpen(TRET)}else if(a==='hideback')tBackHide();else{close();if(!S)onboarding()}return}
const g=e.target.closest('[data-gg]');if(g){const ft=!!g.closest('[data-tourbox]')&&g.dataset.gg!=='help';if(ft)TRET=TI;goGuide(g.dataset.gg);if(ft)tBackShow();else if(g.dataset.gg==='help')tBackHide()}});

/* ===== Pendientes ===== */
const PNL=()=>S.pend||(S.pend=[]);
const pRest=p=>r2(p.a-(p.paid||0));
const dShort=d=>{const[y,m,x]=d.split('-').map(Number);return new Date(y,m-1,x).toLocaleDateString('es-ES',{day:'numeric',month:'short'})};
const dDiff=d=>{const[a,b,c]=d.split('-').map(Number),[e,f,g]=today().split('-').map(Number);return Math.round((new Date(a,b-1,c)-new Date(e,f-1,g))/864e5)};
function pDue(p){if(p.done||!p.due)return{t:p.done?'':'Sin fecha',c:'mute'};const n=dDiff(p.due);

function stCats(k){const D=stData(STN),i=D.findIndex(d=>d.k===k),cur=D[i]||D[D.length-1],prev=D[D.indexOf(cur)-1];
